name: WASM

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      targets:
        description: CMake targets to build
        default: "circt-opt firtool circt-synth circt-verilog arcilator"
        required: false
      emsdk-version:
        description: Emscripten SDK version
        default: latest
        required: false
      circt-ref:
        description: CIRCT git ref, tag, branch, or SHA to build
        default: ""
        required: false
      release-label:
        description: Version label to publish on Pages
        default: ""
        required: false
      deploy-pages:
        description: Deploy the built web page to GitHub Pages
        default: true
        required: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    name: Build CIRCT WASM
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      CIRCT_WASM_TARGETS: ${{ github.event.inputs.targets || 'circt-opt firtool circt-synth circt-verilog arcilator' }}
      EMSDK_VERSION: ${{ github.event.inputs['emsdk-version'] || 'latest' }}
      CIRCT_REF: ${{ inputs['circt-ref'] || '' }}
      CMAKE_BUILD_PARALLEL_LEVEL: 8
      LLVM_ENABLE_ASSERTIONS: ON

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select CIRCT ref
        if: ${{ env.CIRCT_REF != '' }}
        shell: bash
        run: |
          git -C circt fetch --tags origin
          git -C circt checkout --detach "${CIRCT_REF}"
          git -C circt submodule update --init --recursive

      - name: Install host packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build python3 git ca-certificates

      - name: Cache native tablegen build
        uses: actions/cache@v4
        with:
          path: build/host
          key: host-tablegen-${{ runner.os }}-${{ env.LLVM_ENABLE_ASSERTIONS }}-${{ hashFiles('circt/.git', '.git/modules/circt/HEAD', 'scripts/build-wasm.sh', 'patches/*.patch') }}

      - name: Cache Emscripten SDK
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/emsdk
            .cache/emscripten
          key: emsdk-${{ runner.os }}-${{ env.EMSDK_VERSION }}

      - name: Install Emscripten SDK
        shell: bash
        run: |
          if [[ ! -d "${RUNNER_TEMP}/emsdk/.git" ]]; then
            rm -rf "${RUNNER_TEMP}/emsdk"
            git clone https://github.com/emscripten-core/emsdk.git "${RUNNER_TEMP}/emsdk"
          else
            git -C "${RUNNER_TEMP}/emsdk" pull --ff-only
          fi
          "${RUNNER_TEMP}/emsdk/emsdk" install "${EMSDK_VERSION}"
          "${RUNNER_TEMP}/emsdk/emsdk" activate "${EMSDK_VERSION}"

      - name: Build WASM tools
        shell: bash
        run: |
          source "${RUNNER_TEMP}/emsdk/emsdk_env.sh"
          ./scripts/build-wasm.sh

      - name: Smoke test
        shell: bash
        run: |
          source "${RUNNER_TEMP}/emsdk/emsdk_env.sh"
          ./scripts/smoke-test.sh

      - name: Upload WASM artifact
        uses: actions/upload-artifact@v4
        with:
          name: circt-wasm
          path: |
            build/wasm/bin/circt-opt.js
            build/wasm/bin/circt-opt.wasm
            build/wasm/bin/firtool.js
            build/wasm/bin/firtool.wasm
            build/wasm/bin/circt-synth.js
            build/wasm/bin/circt-synth.wasm
            build/wasm/bin/circt-verilog.js
            build/wasm/bin/circt-verilog.wasm
            build/wasm/bin/arcilator.js
            build/wasm/bin/arcilator.wasm
          if-no-files-found: error

  deploy-pages:
    name: Deploy Pages
    runs-on: ubuntu-24.04
    needs: build
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs['deploy-pages']) }}
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download WASM artifact
        uses: actions/download-artifact@v4
        with:
          name: circt-wasm
          path: build/wasm/bin

      - name: Prepare Pages artifact
        shell: bash
        env:
          VERSION_LABEL: ${{ inputs['release-label'] || inputs['circt-ref'] || 'current' }}
          CIRCT_REF: ${{ inputs['circt-ref'] || 'submodule' }}
          PREVIOUS_PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: |
          python3 scripts/prepare-pages-site.py \
            --site-dir _site \
            --web-dir examples/web \
            --bin-dir build/wasm/bin \
            --version-label "${VERSION_LABEL}" \
            --circt-ref "${CIRCT_REF}" \
            --previous-base-url "${PREVIOUS_PAGES_URL}"

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
