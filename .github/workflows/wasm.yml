name: WASM

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      targets:
        description: CMake targets to build
        default: "circt-opt firtool circt-synth circt-verilog arcilator"
        required: false
      emsdk-version:
        description: Emscripten SDK version
        default: latest
        required: false
      deploy-pages:
        description: Deploy the built web page to GitHub Pages
        default: true
        required: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: wasm-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build CIRCT WASM
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      CIRCT_WASM_TARGETS: ${{ github.event.inputs.targets || 'circt-opt firtool circt-synth circt-verilog arcilator' }}
      EMSDK_VERSION: ${{ github.event.inputs['emsdk-version'] || 'latest' }}
      CMAKE_BUILD_PARALLEL_LEVEL: 8
      LLVM_ENABLE_ASSERTIONS: ON

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install host packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build python3 git ca-certificates

      - name: Cache native tablegen build
        uses: actions/cache@v4
        with:
          path: build/host
          key: host-tablegen-${{ runner.os }}-${{ env.LLVM_ENABLE_ASSERTIONS }}-${{ hashFiles('circt/.git', '.git/modules/circt/HEAD', 'scripts/build-wasm.sh', 'patches/*.patch') }}
          restore-keys: |
            host-tablegen-${{ runner.os }}-${{ env.LLVM_ENABLE_ASSERTIONS }}-

      - name: Cache Emscripten SDK
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/emsdk
            .cache/emscripten
          key: emsdk-${{ runner.os }}-${{ env.EMSDK_VERSION }}

      - name: Install Emscripten SDK
        shell: bash
        run: |
          if [[ ! -d "${RUNNER_TEMP}/emsdk/.git" ]]; then
            rm -rf "${RUNNER_TEMP}/emsdk"
            git clone https://github.com/emscripten-core/emsdk.git "${RUNNER_TEMP}/emsdk"
          else
            git -C "${RUNNER_TEMP}/emsdk" pull --ff-only
          fi
          "${RUNNER_TEMP}/emsdk/emsdk" install "${EMSDK_VERSION}"
          "${RUNNER_TEMP}/emsdk/emsdk" activate "${EMSDK_VERSION}"

      - name: Build WASM tools
        shell: bash
        run: |
          source "${RUNNER_TEMP}/emsdk/emsdk_env.sh"
          ./scripts/build-wasm.sh

      - name: Smoke test
        shell: bash
        run: |
          source "${RUNNER_TEMP}/emsdk/emsdk_env.sh"
          ./scripts/smoke-test.sh

      - name: Upload WASM artifact
        uses: actions/upload-artifact@v4
        with:
          name: circt-wasm
          path: |
            build/wasm/bin/circt-opt.js
            build/wasm/bin/circt-opt.wasm
            build/wasm/bin/firtool.js
            build/wasm/bin/firtool.wasm
            build/wasm/bin/circt-synth.js
            build/wasm/bin/circt-synth.wasm
            build/wasm/bin/circt-verilog.js
            build/wasm/bin/circt-verilog.wasm
            build/wasm/bin/arcilator.js
            build/wasm/bin/arcilator.wasm
          if-no-files-found: error

  deploy-pages:
    name: Deploy Pages
    runs-on: ubuntu-24.04
    needs: build
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy-pages) }}
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download WASM artifact
        uses: actions/download-artifact@v4
        with:
          name: circt-wasm
          path: build/wasm/bin

      - name: Prepare Pages artifact
        shell: bash
        run: |
          rm -rf _site
          mkdir -p _site/examples _site/build/wasm/bin
          cp -R examples/web _site/examples/
          cp build/wasm/bin/*.js _site/build/wasm/bin/
          cp build/wasm/bin/*.wasm _site/build/wasm/bin/
          touch _site/.nojekyll
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8">
              <meta http-equiv="refresh" content="0; url=examples/web/">
              <title>CIRCT WASM Runner</title>
              <link rel="canonical" href="examples/web/">
            </head>
            <body>
              <p><a href="examples/web/">Open CIRCT WASM Runner</a></p>
            </body>
          </html>
          HTML

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
